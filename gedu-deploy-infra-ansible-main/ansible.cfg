[defaults]
inventory = inventories/production/hosts.ini
roles_path = ./roles
fact_caching = jsonfile
host_key_checking = False
retry_files_enabled = False
gathering = smart

; ANSIBLE_ROLES_PATH=./roles ansible-playbook -i inventories/production/hosts.ini site.yml --extra-vars "ansible_password=${ANSIBLE_PASSWORD}"
; ANSIBLE_PASSWORD='Gtel@123' ansible -i inventories/production/hosts.ini all -m ping --extra-vars "ansible_password=$ANSIBLE_PASSWORD"

