---
- name: Deploy Docker with Harbor Certificate Trust
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: false

  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_user: ansible_user
    ansible_ssh_private_key_file: ~/.ssh/id_rsa_geduhub

  roles:
    - docker
