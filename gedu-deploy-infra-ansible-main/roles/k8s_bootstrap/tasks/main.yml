---
- name: Update all packages (RedHat)
  ansible.builtin.yum:
    name: "*"
    state: latest
  when:
    - ansible_os_family == "RedHat"
    - k8s_update_kernel # Only run if k8s_update_kernel is true
  register: yum_update_result # Register the result for later use

- name: Reboot if kernel update was applied (RedHat)
  ansible.builtin.reboot:
  when:
    - ansible_os_family == "RedHat"
    - yum_update_result is defined
    - yum_update_result.reboot_required | default(false)
    - k8s_update_kernel # Only relevant if kernel updates were attempted

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  
- name: Add host entries to /etc/hosts for all nodes
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ hostvars[item]['ansible_host'] }} {{ hostvars[item]['inventory_hostname'] }}.{{ k8s_domain_name }} {{ hostvars[item]['inventory_hostname'] }}"
    regexp: "^{{ hostvars[item]['ansible_host'] }}.*" # Look for existing line starting with IP
    state: present
    create: yes
    backup: yes
  loop: "{{ groups | dict2items | selectattr('key', 'in', hosts_file_groups) | map(attribute='value') | flatten | unique }}" # <-- Modified loop
  loop_control:
    loop_var: item # Using 'item' as the loop variable since 'host' is often reserved/used internally

- name: Disable SELinux
  ansible.builtin.selinux:
    state: permissive
    policy: targeted
  notify: reboot_server # This will trigger the handler if SELinux state changes

- name: Disable and stop Firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: stopped
    enabled: false

- name: Disable swap
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb > 0

- name: Remove swap entry from /etc/fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^(.*swap.*)$'
    line: '#\1'
    backup: yes
    state: present

- name: Load br_netfilter module
  ansible.builtin.modprobe:
    name: br_netfilter
    state: present

- name: Configure sysctl parameters for Kubernetes
  ansible.builtin.copy:
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.ipv4.ip_forward = 1
      net.bridge.bridge-nf-call-ip6tables = 1 # Recommended for IPv6 too, even if not strictly used.
    dest: /etc/sysctl.d/k8s.conf
    owner: root
    group: root
    mode: '0644'
  notify: apply_sysctl_parameters # Trigger handler to apply if content changes

- name: Apply sysctl parameters (Explicitly, though typically handled by notify)
  ansible.builtin.command: sysctl --system
  changed_when: false # This command is idempotent if the file hasn't changed.

- name: Install chrony for NTP synchronization (RedHat)
  ansible.builtin.yum:
    name: chrony
    state: present
  when: ansible_os_family == "RedHat"

- name: Enable and start chrony service
  ansible.builtin.systemd:
    name: chronyd # Use 'chronyd' for RedHat, 'chrony' for Debian/Ubuntu
    state: started
    enabled: true