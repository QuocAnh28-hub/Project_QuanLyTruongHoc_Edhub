---
# RKE installation settings
rke_install_dir: /opt/rke
rke_download_url: https://github.com/rancher/rke/releases/download/v1.8.4/rke_linux-amd64

# Docker configuration
docker_daemon_config:
  exec_opts: ["native.cgroupdriver=systemd"]
  log_driver: "json-file"
  log_opts:
    max_size: "100m"
  storage_driver: "overlay2"

# System configuration
sysctl_params:
  net.bridge.bridge-nf-call-iptables: 1
  net.ipv4.ip_forward: 1
  net.bridge.bridge-nf-call-ip6tables: 1

# Kernel modules to load
kernel_modules:
  - overlay
  - br_netfilter

# Harbor configuration for certificate management
harbor_hostname: "registry.eduhub.com"
harbor_cert_dir: "/opt/harbor/certs"
harbor_enable_cert: true
