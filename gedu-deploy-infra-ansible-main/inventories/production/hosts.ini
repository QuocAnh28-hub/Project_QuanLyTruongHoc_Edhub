[docker_registry]
docker_registry_01 ansible_host=10.47.198.51

[github_runner]
github_runner_01 ansible_host=10.47.198.51

[github_runner:vars]
# GitHub Configuration
github_org=gedu-hub
github_repo=
github_access_token=
github_runner_token=
github_runner_labels=self-hosted,ubuntu-runner,gedu-runner,docker-runner
github_runner_group=docker-runners
github_runner_container_user=ansible_user

# Resource Limits
github_runner_memory_limit=2g
github_runner_cpu_limit=1

# Auto-scaling Configuration
github_runner_auto_scaling=true
github_runner_min_runners=2
github_runner_max_runners=5

[masters]
k8s_master_01 ansible_host=10.47.197.29
k8s_master_02 ansible_host=10.47.197.32
k8s_master_03 ansible_host=10.47.197.33

[workers]
k8s_worker_02 ansible_host=10.47.197.33
k8s_worker_03 ansible_host=10.47.197.34
k8s_worker_04 ansible_host=10.47.197.35
k8s_worker_05 ansible_host=10.47.197.36

[k8s_cluster:children]
masters
workers

[data_lake]
lake_01 ansible_host=10.47.198.51
lake_02 ansible_host=10.47.198.52
lake_03 ansible_host=10.47.198.53
lake_04 ansible_host=10.47.198.54

[database]
db_01 ansible_host=10.47.198.61
db_02 ansible_host=10.47.198.62
db_03 ansible_host=10.47.198.63

[all:vars]
ansible_user=ansible_user
ansible_ssh_private_key_file: ~/.ssh/id_rsa_geduhub
ansible_become=true
ansible_connection=ssh
ansible_port=22
ansible_python_interpreter=/usr/bin/python3

; To use password auth, comment out the ssh_private_key_file line above and uncomment the line below:
; ansible_ssh_pass="{{ ansible_password }}"

rke_version=v1.8.4
rke_binary_path=/usr/local/bin/rke
rke_download_url=https://github.com/rancher/rke/releases/download/{{ rke_version }}/rke_linux-amd64
