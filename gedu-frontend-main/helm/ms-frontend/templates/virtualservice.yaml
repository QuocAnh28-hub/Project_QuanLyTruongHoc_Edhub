{{- if .Values.virtualService.enabled }}
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ include "ms-frontend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "ms-frontend.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- with .Values.virtualService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gateways:
    - {{ .Values.virtualService.gateway }}
  hosts:
    - {{ .Values.virtualService.host | quote }}
  http:
    - match:
        - uri:
            prefix: {{ .Values.virtualService.uriPrefix | quote }}
      route:
        - destination:
            host: {{ .Values.virtualService.service }}.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.virtualService.port }}
{{- end }}
