name: CI Deploy Pipeline

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stag
          - main
      service:
        description: 'Service to build and deploy'
        required: true
        default: 'notification'
        type: choice
        options:
          - notification

env:
  IMAGE_REGISTRY: registry.eduhub.com

jobs:
  build-and-deploy:
    name: Build & Deploy (${{ inputs.branch }} - ${{ inputs.service }})
    runs-on: [gedu-runner]

    steps:
      - name: Install Git (if missing)
        run: |
          if ! command -v git &> /dev/null; then
            sudo apt-get update -y
            sudo apt-get install -y git
          fi

      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ inputs.service }}-${{ hashFiles(format('services/{0}/Dockerfile', inputs.service), format('services/{0}/**/requirements.txt', inputs.service)) }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ inputs.service }}-

      - name: Log in to Docker registry
        run: echo "${{ secrets.HARBOR_PASSWORD }}" | docker login ${{ env.IMAGE_REGISTRY }} -u "${{ secrets.HARBOR_USERNAME }}" --password-stdin

      - name: Build and Push for DEV
        if: inputs.branch == 'dev'
        run: make docker-push-dev SERVICE=${{ inputs.service }}
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and Push for STAG
        if: inputs.branch == 'stag'
        run: make docker-push-stag SERVICE=${{ inputs.service }}
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and Push for PROD
        if: inputs.branch == 'main'
        run: make docker-push-prod SERVICE=${{ inputs.service }}
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
