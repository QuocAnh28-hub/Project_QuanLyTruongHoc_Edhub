<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
    <defs>
        <style type="text/css">
            .gear { fill: #2563eb; }
            .gear-inner { fill: #1e40af; }
            .arrow { fill: none; stroke: #10b981; stroke-width: 4; }
            .document { fill: #f3f4f6; stroke: #6b7280; }
            .text-line { fill: #d1d5db; }
        </style>
    </defs>
    
    <!-- Background Circle -->
    <circle cx="100" cy="100" r="90" fill="#dbeafe" opacity="0.3"/>
    
    <!-- Gears -->
    <g transform="translate(60,60)">
        <path class="gear" d="M40,0 L44,10 L54,12 L50,20 L54,28 L44,30 L40,40 L36,30 L26,28 L30,20 L26,12 L36,10 L40,0Z">
            <animateTransform 
                attributeName="transform"
                attributeType="XML"
                type="rotate"
                from="0 40 20"
                to="360 40 20"
                dur="10s"
                repeatCount="indefinite"/>
        </path>
        <circle class="gear-inner" cx="40" cy="20" r="5"/>
    </g>
    
    <!-- Documents -->
    <g transform="translate(100,70)">
        <rect class="document" x="0" y="0" width="40" height="50"/>
        <rect class="text-line" x="5" y="10" width="30" height="2"/>
        <rect class="text-line" x="5" y="20" width="20" height="2"/>
        <rect class="text-line" x="5" y="30" width="25" height="2"/>
    </g>
    
    <!-- Circular Arrows -->
    <path class="arrow" d="M60,140 A40,40 0 1,1 140,140">
        <animateTransform 
            attributeName="transform"
            attributeType="XML"
            type="rotate"
            from="0 100 100"
            to="360 100 100"
            dur="15s"
            repeatCount="indefinite"/>
    </path>
    <path d="M135,135 L140,140 L145,135" stroke="#10b981" stroke-width="4" fill="none"/>
</svg> 