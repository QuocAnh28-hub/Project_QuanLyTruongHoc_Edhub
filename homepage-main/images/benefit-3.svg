<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
    <defs>
        <style type="text/css">
            .chart-bg { fill: #f3f4f6; stroke: #d1d5db; }
            .bar-1 { fill: #2563eb; }
            .bar-2 { fill: #10b981; }
            .bar-3 { fill: #f59e0b; }
            .line { fill: none; stroke: #1e40af; stroke-width: 3; }
            .dot { fill: #1e40af; }
            .grid { stroke: #e5e7eb; stroke-width: 1; }
        </style>
    </defs>
    
    <!-- Background Circle -->
    <circle cx="100" cy="100" r="90" fill="#dbeafe" opacity="0.3"/>
    
    <!-- Chart Background -->
    <rect class="chart-bg" x="40" y="40" width="120" height="120" rx="10"/>
    
    <!-- Grid Lines -->
    <g class="grid">
        <line x1="40" y1="70" x2="160" y2="70"/>
        <line x1="40" y1="100" x2="160" y2="100"/>
        <line x1="40" y1="130" x2="160" y2="130"/>
        <line x1="70" y1="40" x2="70" y2="160"/>
        <line x1="100" y1="40" x2="100" y2="160"/>
        <line x1="130" y1="40" x2="130" y2="160"/>
    </g>
    
    <!-- Bar Chart -->
    <g transform="translate(50,0)">
        <rect class="bar-1" x="0" y="80" width="20" height="80"/>
        <rect class="bar-2" x="30" y="60" width="20" height="100"/>
        <rect class="bar-3" x="60" y="100" width="20" height="60"/>
    </g>
    
    <!-- Line Chart -->
    <path class="line" d="M50,120 C70,100 90,130 110,80 C130,60 150,90 170,70">
        <animate 
            attributeName="stroke-dasharray"
            attributeType="XML"
            from="0,1000"
            to="1000,0"
            dur="2s"
            fill="freeze"/>
    </path>
    
    <!-- Data Points -->
    <g class="dot">
        <circle cx="50" cy="120" r="4"/>
        <circle cx="80" cy="100" r="4"/>
        <circle cx="110" cy="80" r="4"/>
        <circle cx="140" cy="90" r="4"/>
        <circle cx="170" cy="70" r="4"/>
    </g>
    
    <!-- Animated Pulse -->
    <circle cx="170" cy="70" r="8" stroke="#1e40af" stroke-width="2" fill="none">
        <animate 
            attributeName="r"
            attributeType="XML"
            values="8;12;8"
            dur="2s"
            repeatCount="indefinite"/>
        <animate 
            attributeName="opacity"
            attributeType="CSS"
            values="1;0;1"
            dur="2s"
            repeatCount="indefinite"/>
    </circle>
</svg> 