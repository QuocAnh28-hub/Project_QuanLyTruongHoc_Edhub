<?xml version="1.0" encoding="UTF-8"?>
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <style>
        .bg { fill: #dbeafe; }
        .suit { fill: #1e40af; }
        .face { fill: #fcd34d; }
        .hair { fill: #1f2937; }
        .shirt { fill: #f3f4f6; }
    </style>
    
    <!-- Background -->
    <circle class="bg" cx="50" cy="50" r="50"/>
    
    <!-- Body -->
    <path class="suit" d="M25,85 C25,85 35,65 50,65 C65,65 75,85 75,85 L75,100 L25,100 Z"/>
    <rect class="shirt" x="40" y="65" width="20" height="20"/>
    
    <!-- Head -->
    <circle class="face" cx="50" cy="45" r="20"/>
    
    <!-- Hair -->
    <path class="hair" d="M30,45 C30,35 40,25 50,25 C60,25 70,35 70,45 C70,45 65,35 50,35 C35,35 30,45 30,45 Z"/>
    
    <!-- Face Details -->
    <g fill="#1f2937">
        <!-- Eyes -->
        <circle cx="43" cy="42" r="2"/>
        <circle cx="57" cy="42" r="2"/>
        
        <!-- Smile -->
        <path d="M42,50 C42,50 46,55 50,55 C54,55 58,50 58,50" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    </g>
</svg> 