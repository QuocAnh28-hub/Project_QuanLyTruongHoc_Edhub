name: gedu_mobile_provider
description: "Gedu Mobile Provider App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Core packages
  core_storage: ^0.0.1
  core_auth: ^0.0.1
  core_network: ^0.0.1
  core_students: ^0.0.1
  core_localization: ^0.0.1

  # Library packages
  lib_base: ^0.0.1
  lib_design_system: ^0.0.1
  lib_utils: ^0.0.1

  # Feature packages
  feature_auth: ^0.0.1
  feature_home: ^0.0.1

  # External dependencies
  get_it: ^8.0.3
  injectable: ^2.5.0
  go_router: ^16.0.0
  flutter_bloc: ^9.1.1
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.4
  device_info_plus: ^11.5.0
  package_info_plus: ^8.0.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.5
  rxdart: ^0.28.0
  dartx: ^1.2.0
  tuple: ^2.0.2
  intl: ^0.20.2
  json_annotation: ^4.9.0
  freezed: ^3.1.0
  flutter_svg: ^2.0.15+1
  lottie: ^2.7.0
  infinite_scroll_pagination: ^5.1.0
  dio_cache_interceptor: ^4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.5.4
  build_runner_core: ^9.1.2
  freezed: ^3.1.0
  injectable_generator: ^2.7.0
  json_serializable: ^6.9.5
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/config/